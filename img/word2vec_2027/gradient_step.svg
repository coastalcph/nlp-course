<text x="972" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#245da8" font-weight="400" text-anchor="middle">∇ₑL: (0, −1)</text>
<text x="972" y="176" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#087c73" font-weight="400" text-anchor="middle">error: −0.5</text>
