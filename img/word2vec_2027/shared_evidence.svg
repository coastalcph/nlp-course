<text x="142.5" y="209.32" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#172b45" font-weight="400" text-anchor="middle">from the corpus</text>
<line x1="270" y1="173" x2="362" y2="93" stroke="#245da8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="270" y1="195" x2="362" y2="285" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
