<line x1="670" y1="284" x2="740" y2="284" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="755" y="45" width="315" height="98" rx="10" fill="white" stroke="#245da8" stroke-width="2"/>
