<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img">
<title>Training scores and downstream word vectors use different table roles</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="100%" fill="white"/>
<text x="275" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#172b45" font-weight="700" text-anchor="middle">During training</text>
<text x="825" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#172b45" font-weight="700" text-anchor="middle">A common downstream choice</text>
<line x1="550" y1="57" x2="550" y2="330" stroke="#cbd5e1" stroke-width="2"/>
<rect x="25" y="85" width="220" height="70" rx="10" fill="white" stroke="#245da8" stroke-width="2"/>
<text x="135.0" y="128.16" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#245da8" font-weight="400" text-anchor="middle">E[apples]</text>
<rect x="300" y="85" width="220" height="70" rx="10" fill="white" stroke="#087c73" stroke-width="2"/>
<text x="410.0" y="128.16" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#087c73" font-weight="400" text-anchor="middle">O[tasty]</text>
<line x1="135" y1="163" x2="220" y2="225" stroke="#245da8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="410" y1="163" x2="320" y2="225" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="275" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">input–output dot product</text>
<rect x="605" y="85" width="205" height="70" rx="10" fill="white" stroke="#245da8" stroke-width="2"/>
<text x="707.5" y="128.16" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#245da8" font-weight="400" text-anchor="middle">E[apples]</text>
<rect x="855" y="85" width="220" height="70" rx="10" fill="white" stroke="#245da8" stroke-width="2"/>
<text x="965.0" y="128.16" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#245da8" font-weight="400" text-anchor="middle">E[oranges]</text>
<line x1="710" y1="163" x2="775" y2="225" stroke="#245da8" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="965" y1="163" x2="882" y2="225" stroke="#245da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="825" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#245da8" font-weight="400" text-anchor="middle">input–input cosine</text>
<text x="825" y="326" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#52637a" font-weight="400" text-anchor="middle">Reuse E as the embedding lookup.</text>
</svg>
