<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img">
<title>Three independent binary predictions in negative sampling</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="100%" fill="white"/>
<rect x="25" y="134" width="220" height="85" rx="10" fill="white" stroke="#245da8" stroke-width="2"/>
<text x="135.0" y="186.02" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#245da8" font-weight="400" text-anchor="middle">E[apples]</text>
<line x1="255" y1="176" x2="390" y2="71" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="38" width="220" height="66" rx="10" fill="white" stroke="#087c73" stroke-width="2"/>
<text x="515.0" y="79.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#087c73" font-weight="400" text-anchor="middle">O[tasty]</text>
<line x1="638" y1="71" x2="693" y2="71" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="80" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#087c73" font-weight="400" text-anchor="start">Observed pair: y = 1</text>
<line x1="255" y1="176" x2="390" y2="175" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="142" width="220" height="66" rx="10" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="515.0" y="183.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#b45309" font-weight="400" text-anchor="middle">O[furry]</text>
<line x1="638" y1="175" x2="693" y2="175" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#b45309" font-weight="400" text-anchor="start">Noise draw: y = 0</text>
<line x1="255" y1="176" x2="390" y2="279" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="246" width="220" height="66" rx="10" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="515.0" y="287.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#b45309" font-weight="400" text-anchor="middle">O[rabbits]</text>
<line x1="638" y1="279" x2="693" y2="279" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#b45309" font-weight="400" text-anchor="start">Noise draw: y = 0</text>
<text x="550" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#52637a" font-weight="400" text-anchor="middle">k = 2 noise samples • q(c) ∝ frequency(c)⁰·⁷⁵ • scores are independent sigmoids</text>
</svg>
