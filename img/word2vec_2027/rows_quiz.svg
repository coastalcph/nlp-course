<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="355" viewBox="0 0 1100 355" role="img">
<title>Which parameter rows does one SGNS example touch?</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="100%" fill="white"/>
<text x="550" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#172b45" font-weight="700" text-anchor="middle">Centre: apples     Positive: tasty     Noise: furry, rabbits</text>
<rect x="25" y="85" width="510" height="112" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="280.0" y="132.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">A   Every row of E</text>
<text x="280.0" y="165.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">     and every row of O</text>
<rect x="565" y="85" width="510" height="112" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="820.0" y="132.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">B   E[apples, tasty, furry, rabbits]</text>
<text x="820.0" y="165.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">     No rows of O</text>
<rect x="25" y="224" width="510" height="112" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="280.0" y="271.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">C   E[apples]</text>
<text x="280.0" y="304.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">     O[tasty, furry, rabbits]</text>
<rect x="565" y="224" width="510" height="112" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="820.0" y="271.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">D   E[apples]</text>
<text x="820.0" y="304.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#172b45" font-weight="400" text-anchor="middle">     Every row of O</text>
</svg>
