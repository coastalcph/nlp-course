<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img">
<title>Low-rank score matrix and the shifted-PMI connection</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="100%" fill="white"/>
<rect x="25" y="50" width="180" height="150" rx="10" fill="white" stroke="#245da8" stroke-width="2"/>
<text x="115.0" y="118.36" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#245da8" font-weight="400" text-anchor="middle">E</text>
<text x="115.0" y="151.36" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#245da8" font-weight="400" text-anchor="middle">|V| × d</text>
<text x="235" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#172b45" font-weight="400" text-anchor="middle">×</text>
<rect x="268" y="50" width="205" height="150" rx="10" fill="white" stroke="#087c73" stroke-width="2"/>
<text x="370.5" y="118.36" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#087c73" font-weight="400" text-anchor="middle">Oᵀ</text>
<text x="370.5" y="151.36" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#087c73" font-weight="400" text-anchor="middle">d × |V|</text>
<text x="515" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" fill="#172b45" font-weight="400" text-anchor="middle">=</text>
<rect x="560" y="50" width="225" height="150" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="672.5" y="100.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">Score matrix</text>
<text x="672.5" y="133.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">|V| × |V|</text>
<text x="672.5" y="166.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">rank ≤ d</text>
<line x1="804" y1="125" x2="867" y2="125" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="889" y="50" width="190" height="150" rx="10" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="984.0" y="117.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#b45309" font-weight="400" text-anchor="middle">Related to</text>
<text x="984.0" y="150.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#b45309" font-weight="400" text-anchor="middle">PMI − log k</text>
<text x="550" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#172b45" font-weight="400" text-anchor="middle">The connection is about the objective’s preferred dot products.</text>
<text x="550" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#52637a" font-weight="400" text-anchor="middle">It does not initialize word2vec from a count matrix.</text>
</svg>
