<text x="255" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#245da8" font-weight="700" text-anchor="middle">CBOW</text>
<text x="825" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#087c73" font-weight="700" text-anchor="middle">Skip-gram</text>
