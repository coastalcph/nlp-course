<line x1="825" y1="147" x2="825" y2="200" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
<text x="825" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#087c73" font-weight="400" text-anchor="middle">separate predictions</text>
<line x1="785" y1="253" x2="686" y2="297" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="865" y1="253" x2="963" y2="297" stroke="#087c73" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="600" y="310" width="170" height="55" rx="10" fill="white" stroke="#087c73" stroke-width="2"/>
<text x="685.0" y="345.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#087c73" font-weight="400" text-anchor="middle">are</text>
