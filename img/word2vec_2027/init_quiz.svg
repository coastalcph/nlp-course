<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="315" viewBox="0 0 1100 315" role="img">
<title>Initialization quiz with four options</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="100%" fill="white"/>
<rect x="45" y="25" width="210" height="78" rx="10" fill="white" stroke="#245da8" stroke-width="2"/>
<text x="150.0" y="74.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#245da8" font-weight="400" text-anchor="middle">e ≠ 0</text>
<text x="365" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#172b45" font-weight="400" text-anchor="middle">score = oᵀe</text>
<rect x="480" y="25" width="210" height="78" rx="10" fill="white" stroke="#087c73" stroke-width="2"/>
<text x="585.0" y="74.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#087c73" font-weight="400" text-anchor="middle">o = 0</text>
<text x="880" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">Take one SGD step.</text>
<rect x="45" y="150" width="470" height="65" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="280.0" y="191.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">A   Input E only</text>
<rect x="565" y="150" width="470" height="65" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="800.0" y="191.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">B   Output O only</text>
<rect x="45" y="236" width="470" height="65" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="280.0" y="277.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">C   Both tables</text>
<rect x="565" y="236" width="470" height="65" rx="10" fill="white" stroke="#172b45" stroke-width="2"/>
<text x="800.0" y="277.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b45" font-weight="400" text-anchor="middle">D   Neither table</text>
</svg>
